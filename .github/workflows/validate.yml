name: validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Reject tenant-specific and secret public content
        run: python3 scripts/check_public_content.py

      - name: Show PowerShell version (runner ships 7.4 LTS; the runbook targets the PowerShell74 runtime)
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: Parse PowerShell and check safety markers
        shell: pwsh
        run: ./tests/StaticValidation.ps1

      - name: Behavioural harness against the real runbook (mocked ARM transport)
        shell: pwsh
        run: ./tests/BehaviorHarness.ps1

      - name: PSScriptAnalyzer (errors and warnings fail the build)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery
          $findings = Invoke-ScriptAnalyzer -Path ./src/Enable-SmartTiering.ps1 -Severity Error,Warning
          $findings | Format-Table -AutoSize | Out-String | Write-Host
          if (@($findings).Count -gt 0) { throw "PSScriptAnalyzer reported $(@($findings).Count) finding(s)." }

      - name: Validate RBAC JSON templates
        shell: bash
        run: |
          jq empty infra/rbac/*.json
          jq -e '.NotActions == []' infra/rbac/policy-remediator-role.template.json > /dev/null
          jq -e '.Name == "Azure Backup Smart Tiering Policy Remediator - <role-suffix>" and .Actions == ["Microsoft.RecoveryServices/Vaults/read","Microsoft.RecoveryServices/Vaults/backupPolicies/read","Microsoft.RecoveryServices/Vaults/backupPolicies/write","Microsoft.RecoveryServices/Vaults/backupPolicies/operationResults/read","Microsoft.RecoveryServices/Vaults/backupPolicies/operations/read"] and (.AssignableScopes[0] | endswith("/resourceGroups/<ring-resource-group>"))' infra/rbac/policy-remediator-role.template.json > /dev/null
          jq -e '.Actions == ["Microsoft.RecoveryServices/Vaults/read","Microsoft.RecoveryServices/Vaults/backupPolicies/read"] and .NotActions == []' infra/rbac/discovery-reader-role.template.json > /dev/null
          jq -e '.Actions == ["Microsoft.RecoveryServices/Vaults/read","Microsoft.RecoveryServices/Vaults/backupPolicies/read"] and .NotActions == [] and (.AssignableScopes[0] | endswith("/resourceGroups/<ring-resource-group>"))' infra/rbac/discovery-reader-rg-role.template.json > /dev/null

      - name: Compile Bicep fixture
        shell: bash
        run: az bicep build --file infra/test-environment.bicep --stdout > /dev/null

      - name: Shell scripts parse
        shell: bash
        run: for f in scripts/*.sh; do bash -n "$f"; done

      - name: Documented Bash blocks parse
        shell: bash
        run: |
          awk '/^```bash$/{on=1;next} /^```$/{on=0} on' README.md | bash -n
          awk '/^```bash$/{on=1;next} /^```$/{on=0} on' docs/replicate-in-azure.md | bash -n
